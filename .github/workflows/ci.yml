name: Verify CertMap
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
# Replace stale PR checks; keep push, release, and manual runs independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.x', '1.27.x']
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go vet ./...
      - run: go test ./... -cover
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Fuzz parser
        if: runner.os == 'Linux' && matrix.go == '1.27.x'
        run: go test ./certmap -run '^$' -fuzz '^FuzzParse$' -fuzztime 10s -parallel 2
      - name: Build standalone executable
        run: go build -trimpath -o certmap-ci.exe ./cmd/certmap
      - name: Offline example smoke
        shell: bash
        run: |
          ./certmap-ci.exe inspect --roots examples/roots.pem --dns-name service.example.test --at 2026-10-17T12:00:00Z examples/bundle.pem
          ./certmap-ci.exe diff examples/bundle.pem examples/rotated.pem
          ./certmap-ci.exe --version
