name: Release verified binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# Do not overlap publication attempts for the same release ref.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Check release version
        shell: bash
        run: |
          actual="$(go run ./cmd/certmap --version)"
          test "${actual#certmap }" = "${GITHUB_REF_NAME#v}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python scripts/package.py
      - name: Publish checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python .github/scripts/release_checksums.py dist
          python .github/scripts/release_guard.py dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "Rudy CertMap $GITHUB_REF_NAME" --notes-file docs/RELEASE.md --prerelease
