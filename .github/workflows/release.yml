name: Release verified binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# Do not overlap publication attempts for the same release ref.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Check release version
        shell: bash
        run: |
          actual="$(go run ./cmd/certmap --version)"
          test "${actual#certmap }" = "${GITHUB_REF_NAME#v}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/package.py
      - name: Publish checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Rudy CertMap $GITHUB_REF_NAME" --notes-file docs/RELEASE.md --prerelease
